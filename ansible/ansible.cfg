[defaults]
# The pipeline copies the rendered inventory (scripts/render_inventory.py) to
# inventory/hosts.yml; group_vars/ lives beside it in the same directory.
inventory = inventory/
roles_path = roles
collections_path = .collections
forks = 10
timeout = 60
retry_files_enabled = False
callback_result_format = yaml
callbacks_enabled = ansible.builtin.profile_tasks
interpreter_python = auto_silent

[persistent_connection]
command_timeout = 120
