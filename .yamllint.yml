extends: default

ignore: |
  ansible/.collections/
  ansible/inventory/hosts.yml
  .venv/
  build/
  dist/

rules:
  document-start: disable
  line-length:
    max: 180
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false        # GitHub Actions uses the bare `on:` key
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
