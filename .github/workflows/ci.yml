# Every change is tested before it can reach a site. Runs on GitHub-hosted
# runners only; nothing here touches the lab.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name when reused, so release/observability
  # runs never cancel (or get cancelled by) the plain push-triggered ci run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python tests + site validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate site definitions
        run: python scripts/validate_sites.py
      - name: Simulator tests
        working-directory: simulator
        run: python -m pytest -q
      - name: Remediation relay tests
        working-directory: remediation/relay
        run: python -m pytest -q
      - name: Pipeline script tests
        run: python -m pytest -q scripts/tests

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive terraform
      - name: validate
        run: |
          for dir in terraform/modules/hyperv-vm terraform/stacks/site; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  ansible:
    name: ansible-lint + yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install linters and collections
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/.collections
      - name: yamllint
        run: yamllint --strict .
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --profile production playbooks remediation roles

  powershell:
    name: PSScriptAnalyzer + DSC compile
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analyzer and pinned DSC modules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module ComputerManagementDsc -RequiredVersion 10.0.0 -Scope CurrentUser -Force
          Install-Module NetworkingDsc -RequiredVersion 9.1.0 -Scope CurrentUser -Force
          Install-Module UpdateServicesDsc -RequiredVersion 1.3.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($results | Where-Object Severity -in 'Error', 'Warning') { exit 1 }
      - name: Compile DSC configuration for every role
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\dsc\CampusNode.ps1
          foreach ($role in 'secapp', 'wsus') {
            $out = Join-Path $env:RUNNER_TEMP "mof-$role"
            CampusNode -Role $role -TimeZone 'Central Standard Time' -WsusUrl 'http://192.0.2.10:8530' `
              -TargetGroup 'ring0' -OutputPath $out | Out-Null
            if (-not (Test-Path (Join-Path $out 'localhost.mof'))) { throw "no MOF for $role" }
            Write-Output "compiled $role"
          }
          CampusLcm -OutputPath (Join-Path $env:RUNNER_TEMP 'lcm') | Out-Null

  prometheus:
    name: promtool + amtool
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Render generated rules
        run: |
          pip install PyYAML==6.0.3
          python scripts/render_firmware_rules.py --out observability/prometheus/rules-generated/firmware.rules.yml
      - name: Check config, rules and rule unit tests
        run: |
          # file_sd target files are absent in CI; promtool skips SD files that do not exist.
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/w:ro" -w /w \
            prom/prometheus:v3.15.1 check rules rules/platform.rules.yml rules-generated/firmware.rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/w:ro" -w /w/tests \
            prom/prometheus:v3.15.1 test rules platform_test.yml firmware_test.yml
      - name: Check Alertmanager config
        run: |
          mkdir -p "$RUNNER_TEMP/am-secrets" && echo 'ci-placeholder' > "$RUNNER_TEMP/am-secrets/webhook_token"
          docker run --rm --entrypoint amtool \
            -v "$PWD/observability/alertmanager:/etc/alertmanager:ro" \
            -v "$RUNNER_TEMP/am-secrets:/etc/alertmanager/secrets:ro" \
            prom/alertmanager:v0.34.2 check-config /etc/alertmanager/alertmanager.yml
      - name: Build remediator image
        run: docker build -t campus-remediator:ci remediation/relay

  packer:
    name: packer fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.16.2
      - name: fmt + syntax validate
        run: |
          packer fmt -check packer/
          packer validate -syntax-only packer/ws2025-core.pkr.hcl

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
